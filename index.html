<style>
  :root{
    --bg1:#FFF6F9; --bg2:#FDEFF6; --bg3:#F0FBF7;
    --pink:#FF8FAB; --pink-d:#FF6B9D; --coral:#FFB3C1;
    --mint:#7ED9C3; --mint-d:#4FC8AE; --yellow:#FFD56B; --lav:#B79CED;
    --ink:#5A4A52; --ink-soft:#9A8A92; --line:#F3E2EA;
    --card:#FFFFFF; --danger:#FF6B6B; --shadow:0 8px 22px rgba(255,143,171,.18);
    --r:22px; --side:#FFFDFE;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    background-attachment:fixed;
    min-height:100vh;
    font-size:15px;
    line-height:1.5;
  }

  /* layout */
  .layout{display:flex;min-height:100vh;align-items:stretch}

  /* sidebar */
  .sidebar{
    position:sticky;top:0;align-self:flex-start;
    width:248px;flex:0 0 248px;height:100vh;
    background:linear-gradient(180deg,#FFFDFE,#FFF4F9);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:16px 12px;box-shadow:2px 0 18px rgba(255,143,171,.08);
    z-index:30;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;cursor:pointer;border-radius:14px;transition:.15s}
  .brand:active{transform:scale(.99)}
  .brand .mascot{width:42px;height:42px;flex:0 0 auto}
  .brand .bt{flex:1;min-width:0}
  .brand h1{font-size:16px;margin:0;font-weight:800;line-height:1.25;letter-spacing:.3px}
  .brand .hint{font-size:11px;color:var(--ink-soft);margin-top:2px;display:flex;align-items:center;gap:3px}
  .nav{flex:1;overflow-y:auto;margin-top:6px;padding-right:2px}
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-thumb{background:#F1DCE6;border-radius:999px}
  .sec{margin-bottom:4px}
  .sec-h{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;border-radius:14px;font-weight:800;font-size:14.5px;color:var(--ink);transition:.15s}
  .sec-h:hover{background:#FFF0F6}
  .sec-h.active{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;box-shadow:0 4px 12px rgba(255,107,157,.28)}
  .sec-h .caret{margin-left:auto;font-size:11px;transition:.2s;opacity:.7}
  .sec-h.active .caret{opacity:.95}
  .sec.collapsed .caret{transform:rotate(-90deg)}
  .sub{overflow:hidden}
  .sec.collapsed .sub{display:none}
  .sub a{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 34px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;text-decoration:none;transition:.12s}
  .sub a:hover{background:#FFF5FA;color:var(--ink)}
  .sub a.active{background:#FFF0F6;color:var(--pink-d);font-weight:800}
  .sub a .cnt{margin-left:auto;font-size:11px;color:var(--ink-soft);background:#F6EEF3;border-radius:999px;padding:1px 8px;font-weight:700}
  .sub a.active .cnt{background:#FFE0EC;color:var(--pink-d)}
  .s-status{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    font-size:12px;color:var(--ink-soft);background:#FFF3F7;
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;
  }
  .s-status .dot{width:8px;height:8px;border-radius:50%;background:var(--mint-d)}
  .s-status.syncing .dot{background:var(--yellow);animation:pulse 1s infinite}
  .s-status.offline .dot{background:var(--danger)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:none}
  .wrap{max-width:920px;width:100%;margin:0 auto;padding:18px 18px 40px}

  /* today */
  .today{
    background:linear-gradient(135deg,#FFFDF6,#FFF3F8);
    border:1.5px dashed var(--coral);border-radius:var(--r);
    padding:16px 16px 8px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .today h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:16px;font-weight:800}
  .today h2 .badge{margin-left:auto;font-size:12px;font-weight:700;color:#fff;background:var(--pink-d);border-radius:999px;padding:3px 10px}
  .today .empty{color:var(--ink-soft);font-size:13.5px;padding:8px 2px 12px}
  .tcard{
    background:#fff;border-radius:16px;padding:11px 13px;margin-bottom:10px;
    box-shadow:0 4px 12px rgba(255,143,171,.12);position:relative;
    border-left:6px solid var(--mint);
  }
  .tcard.overdue{border-left-color:var(--danger);background:#FFF6F6}
  .tcard.soon{border-left-color:var(--yellow)}
  .tcard .t-top{display:flex;align-items:center;gap:8px}
  .tcard .t-title{font-weight:700;font-size:15px;flex:1;min-width:0}
  .tcard .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#FFE9EF;color:var(--pink-d)}
  .tcard.overdue .tag{background:#FFE0E0;color:var(--danger)}
  .tcard.soon .tag{background:#FFF3D6;color:#C98A00}
  .tcard .t-meta{font-size:12.5px;color:var(--ink-soft);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .tcard .t-act{margin-top:8px;display:flex;gap:8px}

  /* sub chips (now unused on desktop but kept for safety) */
  .subchips{display:none}

  /* panel */
  .phead{display:flex;align-items:center;gap:10px;margin:4px 2px 12px;flex-wrap:wrap}
  .phead h3{margin:0;font-size:16px;font-weight:800}
  .phead .count{font-size:12px;color:var(--ink-soft);background:#FFF3F7;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .phead .spacer{flex:1}
  .btn-add{
    border:none;cursor:pointer;font-weight:800;font-size:14px;color:#fff;
    background:linear-gradient(135deg,var(--mint),var(--mint-d));
    border-radius:999px;padding:9px 16px;box-shadow:0 4px 12px rgba(79,200,174,.3);
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-add:active{transform:scale(.97)}
  .btn-clear{
    border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink-soft);
    background:#fff;border-radius:999px;padding:8px 13px;
  }
  .btn-grid{
    border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink-soft);
    background:#fff;border-radius:999px;padding:8px 13px;
  }
  .btn-exp,.btn-imp{
    border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink-soft);
    background:#fff;border-radius:999px;padding:8px 13px;transition:.15s;
  }
  .btn-exp:hover,.btn-imp:hover{background:#FFF3F7;color:var(--mint-d);border-color:var(--coral)}
  .btn-exp:active,.btn-imp:active{transform:scale(.97)}
  .imp-tip{font-size:12.5px;color:var(--ink-soft);line-height:1.6;background:#FFF6FA;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:0 0 12px}
  .imp-tip b{color:var(--pink-d)}
  .imp-pick{display:inline-block;font:inherit;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--pink-d));border:none;cursor:pointer;border-radius:14px;padding:11px 18px;box-shadow:0 4px 12px rgba(255,107,157,.25)}
  .imp-pick:active{transform:scale(.97)}
  .imp-preview{margin-top:12px}
  .imp-empty{font-size:13px;color:var(--ink-soft);text-align:center;padding:16px;background:#FAF5F8;border-radius:14px}
  .imp-stats{font-size:13px;margin-bottom:8px;color:var(--ink)}
  .imp-stats b{color:var(--pink-d)}
  .imp-map{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .imp-map .mp{font-size:12px;background:#EAFBF5;border:1px solid #CDEFE4;border-radius:999px;padding:5px 10px;color:#2E8B73}
  .imp-map .mp b{color:var(--ink)}
  .imp-head{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .imp-head .hp{font-size:11.5px;background:#F2F2F4;color:#999;border-radius:8px;padding:4px 8px}
  .imp-head .hp.hit{background:#FFF0D6;color:#B07800}
  .imp-samp{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .imp-samp .srow{display:flex;gap:0;font-size:12px;border-bottom:1px solid #F3EDEF}
  .imp-samp .srow:last-child{border-bottom:none}
  .imp-samp .srow span{flex:1;padding:7px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid #F3EDEF}
  .imp-samp .srow span:last-child{border-right:none}
  .imp-samp .srow.head{background:#FFF6FA;font-weight:800;color:var(--ink)}

  /* cards */
  .card{
    background:var(--card);border-radius:18px;padding:14px 15px;margin-bottom:12px;
    box-shadow:0 5px 16px rgba(255,143,171,.12);border:1px solid #FFF0F5;
  }
  .card-main{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .row{display:flex;gap:8px;margin-top:7px;font-size:13.5px;align-items:baseline}
  .card .row .lbl{flex:0 0 64px;color:var(--ink-soft);font-weight:600}
  .card .row .val{flex:1;color:var(--ink);word-break:break-word}
  .card .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-style:normal;font-size:12px;background:#EEF9F5;color:var(--mint-d);border-radius:999px;padding:2px 9px;font-weight:600}
  .chip.lav{background:#F1ECFD;color:var(--lav)}
  .chip.pink{background:#FFE9EF;color:var(--pink-d)}
  .pill{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .pill.s-done{background:#E7F8F1;color:var(--mint-d)}
  .pill.s-doing{background:#FFF3D6;color:#C98A00}
  .pill.s-todo{background:#FFE9EF;color:var(--pink-d)}
  .pill.s-urgent{background:#FFE0E0;color:var(--danger)}
  .pill.s-imp{background:#FFF0DD;color:#D98324}
  .card-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .mini{
    border:none;cursor:pointer;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 13px;
    background:#F6F0F4;color:var(--ink-soft);
  }
  .mini.done{background:#E7F8F1;color:var(--mint-d)}
  .mini.del{background:#FFF0F0;color:#E08A8A}
  .mini:active{transform:scale(.96)}
  .empty-state{text-align:center;color:var(--ink-soft);padding:34px 10px;font-size:14px}
  .empty-state svg{width:64px;height:64px;opacity:.7;margin-bottom:8px}

  /* overview */
  .ov-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
  .ov-stat{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 5px 16px rgba(255,143,171,.12);border:1px solid #FFF0F5;position:relative;overflow:hidden}
  .ov-stat .n{font-size:30px;font-weight:800;line-height:1}
  .ov-stat .l{font-size:13px;color:var(--ink-soft);margin-top:6px}
  .ov-stat .em{position:absolute;right:12px;top:10px;font-size:26px;opacity:.85}
  .ov-stat.c1 .n{color:var(--pink-d)} .ov-stat.c2 .n{color:var(--mint-d)}
  .ov-stat.c3 .n{color:var(--yellow)} .ov-stat.c4 .n{color:var(--lav)}
  .ov-h{font-size:15px;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center;gap:6px}
  .ov-mods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .ov-mod{background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:0 4px 12px rgba(255,143,171,.1);border:1px solid #FFF0F5;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s}
  .ov-mod:active{transform:scale(.98)}
  .ov-mod .ic{font-size:22px;flex:0 0 auto}
  .ov-mod .mt{flex:1;min-width:0}
  .ov-mod .mt .t{font-weight:800;font-size:14.5px}
  .ov-mod .mt .c{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .ov-mod .arrow{color:var(--coral);font-weight:800}
  .lb{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 12px rgba(255,143,171,.1);margin-bottom:8px}
  .lb-row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .lb-row .nm{flex:0 0 70px;font-weight:700;font-size:13.5px}
  .lb-bar{flex:1;height:14px;background:#F6EEF3;border-radius:999px;overflow:hidden}
  .lb-bar i{display:block;height:100%;border-radius:999px}
  .lb-row .vv{flex:0 0 44px;text-align:right;font-weight:800;font-size:13px}
  .act-item{background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:9px;box-shadow:0 3px 10px rgba(255,143,171,.08);display:flex;gap:10px;align-items:flex-start}
  .act-item .ai{font-size:20px;flex:0 0 auto}
  .act-item .ac{flex:1;min-width:0}
  .act-item .ac .at{font-weight:700;font-size:14px}
  .act-item .ac .ad{font-size:12.5px;color:var(--ink-soft);margin-top:2px}

  /* seat grid — 教室布局 */
  .podium{text-align:center;background:linear-gradient(135deg,#FFB3C8,#FF8FB3);color:#fff;font-weight:800;letter-spacing:6px;padding:10px;border-radius:14px;margin:8px 0 16px;box-shadow:0 6px 16px rgba(255,143,179,.3)}
  .seatgrid{display:grid;gap:8px;margin-top:4px}
  .seat-h{font-size:11.5px;font-weight:800;color:var(--ink-soft);text-align:center;padding:3px 0}
  .seat-h.rowh{align-self:center}
  .seatcell{background:#FFF7FB;border:2px solid var(--line);border-radius:14px;min-height:58px;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.04)}
  .seatcell .seatname{font-weight:800;font-size:14px;line-height:1.1}
  .seatcell .seatno{font-size:11px;color:#b6b0b4;margin-top:3px}
  .seatcell.empty{background:#FAFAFA;border-style:dashed;border-color:#ececec}
  .seatcell{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, outline-color .12s ease;outline:3px solid transparent;outline-offset:1px}
  .seatcell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
  .seatcell.sel{outline-color:#FF4D8D;box-shadow:0 6px 18px rgba(255,77,141,.35);transform:scale(1.05);z-index:2}
  .seat-tip{font-size:12.5px;color:var(--ink-soft);background:#FFF7FB;border:1px dashed var(--line);border-radius:12px;padding:9px 12px;margin:2px 0 14px;line-height:1.5}
  .seat-tip b{color:#FF4D8D}
  .seatcell.boy{border-color:#9ec5fe;background:#eaf3ff}
  .seatcell.boy .seatname{color:#175cbb}
  .seatcell.girl{border-color:#fbcfe0;background:#fff0f6}
  .seatcell.girl .seatname{color:#c2255c}

  /* ---------- 网络韧性：自动重试 + 并发限制 + 失败可恢复 ---------- */
  function retry(fn, times){
    times = times || 3;
    var delays = [500, 1200, 2400];
    function attempt(n){
      return Promise.resolve().then(fn).catch(function(err){
        if(n<=0) throw err;
        var d = delays[times-n] || delays[delays.length-1];
        return new Promise(function(r){ setTimeout(r, d); }).then(function(){ return attempt(n-1); });
      });
    }
    return attempt(times);
  }
  function mapLimit(keys, limit, fn){
    limit = limit || 5;
    var i=0, out=[];
    function step(){
      if(i>=keys.length) return Promise.resolve(out);
      var batch=[];
      while(i<keys.length && batch.length<limit){
        (function(k){ batch.push(Promise.resolve().then(function(){return fn(k);})
          .then(function(r){return {k:k,r:r,ok:true};})
          .catch(function(e){return {k:k,e:e,ok:false};})); })(keys[i++]);
      }
      return Promise.all(batch).then(function(res){ out=out.concat(res); return step(); });
    }
    return step();
  }

    function go(){
      return db.from(tbl(key)).select('id, data').order('created_at',{ascending:true}).then(function(res){
        if(res.error) throw res.error;
        return { results: (res.data||[]).map(function(r){ var o={_id:r.id}; if(r.data) Object.keys(r.data).forEach(function(k){o[k]=r.data[k];}); return o; }) };
      });
    }
    return retry(go, 3);
  }

  function apiUpdate(key, rid, props){

  /* ---------- 座位自由交换（点击两次交换，实时保存云端） ---------- */
  var seatSel=null;
  function clearSeatSel(){ document.querySelectorAll(".seatcell.sel").forEach(function(c){c.classList.remove("sel");}); }
  function onSeatClick(cell){
    var rc=cell.getAttribute("data-rc");
    var rid=cell.getAttribute("data-rid");
    if(seatSel===null){
      if(!rid){ return; }            // 先点空位无意义
      seatSel={rc:rc, rid:rid};
      clearSeatSel(); cell.classList.add("sel");
      toast("已选中，再点另一个座位交换～");
      return;
    }
    if(seatSel.rc===rc){ clearSeatSel(); seatSel=null; return; }  // 点自己=取消
    var a=seatSel, b={rc:rc, rid:rid};
    clearSeatSel(); seatSel=null;
    swapSeats(a,b);
  }
  function swapSeats(a,b){
    var pa=a.rc.split("_"), pb=b.rc.split("_");
    var aR=pa[0], aC=pa[1], bR=pb[0], bC=pb[1];
    var recA=DATA.seats.filter(function(x){return x._id===a.rid;})[0];
    var recB=b.rid?DATA.seats.filter(function(x){return x._id===b.rid;})[0]:null;
    if(!recA) return;
    setStatus("syncing");
    // 乐观更新本地数据并立即重绘
    recA["排号"]=bR+"排"; recA["列号"]=bC+"列";
    if(recB){ recB["排号"]=aR+"排"; recB["列号"]=aC+"列"; }
    renderList("seats");
    // 异步写入云端
    var ups=[apiUpdate("seats", a.rid, {排号:recA["排号"], 列号:recA["列号"]})];
    if(recB){ ups.push(apiUpdate("seats", b.rid, {排号:recB["排号"], 列号:recB["列号"]})); }
    Promise.all(ups).then(function(){ setStatus("ok"); toast("已换座并保存 ✓"); })
      .catch(function(e){ console.error(e); setStatus("offline"); toast("保存失败，正在恢复…"); refreshAll().then(function(){ renderList("seats"); }); });
  }

  function renderHonor(){

      net[nm]=(net[nm]||0)+v;
    });
    var ind=Object.keys(net).map(function(n){return {n:n,v:net[n]};}).sort(function(a,b){return b.v-a.v;}).slice(0,3);
    // 小组净积分 = 组内成员个人积分之和（学习小组来自学生档案）
    var gmap={};
    DATA.students.forEach(function(s){
      var g=s["学习小组"]; if(!g) return;
      var nm=s["姓名"]; if(!nm) return;
      if(!(g in gmap)) gmap[g]=0;
      if(nm in net) gmap[g]+=net[nm];
    });
    var groups=Object.keys(gmap).map(function(g){return {g:g,v:gmap[g]};})
      .filter(function(x){return x.v!==0;}).sort(function(a,b){return b.v-a.v;}).slice(0,2);

    if(!groups.length){
      html+='<div class="empty">暂无小组积分，请先在「学生档案」给同学设置「学习小组」。</div>';

  /* ---------- 今日要处理 ---------- */
  function loadToday(){
    var rows=DATA.affairs, box=document.getElementById("todayList");
    if(!box) return;
    var t=todayStr();
    var overdue=[], todayI=[], soon=[];
    rows.forEach(function(r){
      if(r["状态"]==="已完成") return;
      var d=(r["截止日期"]||"").slice(0,10);
      if(!d){ soon.push(r); return; }
      if(d<t) overdue.push(r);
      else if(d===t) todayI.push(r);
      else if(dayDiff(t,d)<=3) soon.push(r);
    });
    var total=overdue.length+todayI.length+soon.length;
    var bc=document.getElementById("todayCount"); if(bc) bc.textContent=total;
    if(!total){ box.innerHTML='<div class="empty">🎉 今天没有待处理的班务，轻松一下吧～</div>'; return; }
    var html="";
    overdue.forEach(function(r){ html+=todayCard(r,"overdue","已逾期"); });
    todayI.forEach(function(r){ html+=todayCard(r,"","今天截止"); });
    soon.forEach(function(r){ html+=todayCard(r,"soon","即将到期"); });
    box.innerHTML=html;
  }
  function todayCard(r, cls, tag){
    var d=(r["截止日期"]||"").slice(0,10);
    var meta=[];
    if(r["分类"]) meta.push("分类："+r["分类"]);
    if(r["优先级"]) meta.push("优先级："+r["优先级"]);

  function buildForm(key, rec){

      var wrap=document.createElement("div"); wrap.className="field";

      wrap.appendChild(lbl);

      if(f.type==="multi_select"){
        var opts=f.options||[];
        var box=document.createElement("div"); box.className="checks";

        opts.forEach(function(o){
          var lab=document.createElement("label");
          var cb=document.createElement("input"); cb.type="checkbox"; cb.value=o; cb.setAttribute("data-f",f.name);
          if(cur.indexOf(o)>=0) cb.checked=true;
          lab.appendChild(cb); lab.appendChild(document.createTextNode(o));
          box.appendChild(lab);
        });
        wrap.appendChild(box);
      } else if(f.type==="select"){
        var sel=document.createElement("select"); sel.setAttribute("data-f",f.name);
        var ph=document.createElement("option"); ph.value=""; ph.textContent="请选择"; sel.appendChild(ph);
        (f.options||[]).forEach(function(o){
          var op=document.createElement("option"); op.value=o; op.textContent=o; if(val===o) op.selected=true; sel.appendChild(op);
        });
        wrap.appendChild(sel);
      } else if(f.multiline){
        var ta=document.createElement("textarea"); ta.setAttribute("data-f",f.name); ta.placeholder=f.ph||""; if(val) ta.value=val;
        wrap.appendChild(ta);
      } else {
        var inp=document.createElement("input"); inp.type=(f.type==="date")?"date":((f.type==="number")?"number":"text"); inp.setAttribute("data-f",f.name); inp.placeholder=f.ph||""; if(val) inp.value=val;
        wrap.appendChild(inp);
      }
      form.appendChild(wrap);
    });
    Array.prototype.forEach.call(form.querySelectorAll("input,textarea,select"), function(el){
      el.addEventListener("input", function(){ cacheForm(key); });
      el.addEventListener("change", function(){ cacheForm(key); });
    });
    if(rec) localStorage.removeItem("wb_cls_form_"+key);
  }
  function r_get(rec, name){ return rec ? rec[name] : ""; }
  function cacheForm(key){
    try{
      var vals={};
      Array.prototype.forEach.call(document.querySelectorAll('#form [data-f]'), function(el){
        if(el.type==="checkbox"){ if(el.checked) (vals[el.getAttribute("data-f")]=vals[el.getAttribute("data-f")]||[]).push(el.value); }
        else vals[el.getAttribute("data-f")]=el.value;
      });
      localStorage.setItem("wb_cls_form_"+key, JSON.stringify(vals));

  }
  function restoreForm(key){

      var vals=JSON.parse(raw);
      Object.keys(vals).forEach(function(fn){
        var v=vals[fn];
        if(Array.isArray(v)){
          Array.prototype.forEach.call(document.querySelectorAll('#form [data-f="'+fn+'"]'), function(cb){ cb.checked=(v.indexOf(cb.value)>=0); });
        } else {
          var el=document.querySelector('#form [data-f="'+fn+'"]'); if(el) el.value=v;
        }
      });
    }catch(e){}

  function collectProps(key){
    var m=MODULES[key], props={};
    m.fields.forEach(function(f){
      var el=document.querySelector('#form [data-f="'+f.name+'"]');
      if(!el) return;
      if(f.type==="multi_select"){
        var checked=document.querySelectorAll('#form [data-f="'+f.name+'"]:checked');
        var arr=Array.prototype.map.call(checked,function(c){return c.value;});
        if(arr.length) props[f.name]=arr;
      } else if(f.type==="number"){
        if(el.value!=="") props[f.name]=Number(el.value);
      } else if(f.type==="date"){
        if(el.value) props[f.name]=el.value;
      } else if(f.type==="select"){
        if(el.value) props[f.name]=el.value;
      } else {
        if(el.value!=="") props[f.name]=el.value;
      }
    });
    return props;
  }

  function normalize(s){ return String(s==null?"":s).trim().toLowerCase().replace(/[\s_\-－:：，,。.、()（）?]/g,""); }
  function findField(fields, raw){
    var norm=normalize(raw), alias=FIELD_ALIAS[norm];
    if(alias){ for(var i=0;i<fields.length;i++){ if(fields[i].name===alias) return fields[i]; } }
    for(var i=0;i<fields.length;i++){ if(normalize(fields[i].name)===norm) return fields[i]; }
    if(alias){ var an=normalize(alias); for(var i=0;i<fields.length;i++){ if(normalize(fields[i].name)===an) return fields[i]; } }
    for(var i=0;i<fields.length;i++){ var nf=normalize(fields[i].name); if(nf.indexOf(norm)>=0||norm.indexOf(nf)>=0) return fields[i]; }
    return null;
  }
  function buildMapping(key, headers){
    var fields=MODULES[key].fields, map={}, used={};
    headers.forEach(function(h){
      if(used[h]) return;
      var f=findField(fields,h);
      if(f && !map[f.name]){ map[f.name]=h; used[h]=1; }
    });
    return map;
  }
  function splitCsvLine(line){
    var out=[],cur="",q=false;
    for(var i=0;i<line.length;i++){ var ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===','){ out.push(cur); cur=""; } else if(ch==='\t'){ out.push(cur); cur=""; } else cur+=ch; }
    }
    out.push(cur);
    return out.map(function(s){return s.trim();});
  }
  function parseCSV(text){
    text=String(text==null?"":text).replace(/^﻿/,"");
    var lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(function(l){return l.trim()!=="";});
    if(!lines.length) return {headers:[],rows:[]};
    var headers=splitCsvLine(lines[0]);
    var rows=lines.slice(1).map(function(l){
      var c=splitCsvLine(l), o={};
      headers.forEach(function(h,i){ o[h]=(c[i]==null?"":c[i]); });
      return o;
    });
    return {headers:headers, rows:rows};
  }

  /* ---------- 文件解析库（按需懒加载，固定版本，国内镜像优先） ---------- */
  var LIB={
    xlsx:["https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js","https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js"],

    pdfWorker:"https://lib.baomitu.com/pdf.js/3.11.174/pdf.worker.min.js"
  };
  var _libCache={};
  function loadScript(urls){
    if(typeof urls==="string") urls=[urls];
    return new Promise(function(resolve,reject){
      (function tryNext(i){
        if(i>=urls.length){ reject(new Error("解析组件加载失败，请检查网络（可尝试把文件另存为 CSV(UTF-8) 后再导入）")); return; }
        var url=urls[i];
        if(_libCache[url]==="ok"){ resolve(); return; }
        if(_libCache[url]==="fail"){ tryNext(i+1); return; }
        var s=document.createElement("script");
        s.src=url; s.onload=function(){ _libCache[url]="ok"; resolve(); };
        s.onerror=function(){ _libCache[url]="fail"; tryNext(i+1); };
        document.head.appendChild(s);
      })(0);
    });
  }
  function detectType(file){
    var n=(file.name||"").toLowerCase();
    if(n.endsWith(".xlsx")||n.endsWith(".xls")) return "xlsx";
    if(n.endsWith(".docx")) return "docx";
    if(n.endsWith(".pdf")) return "pdf";
    return "csv";
  }
  function aoa2hr(aoa){
    if(!aoa||!aoa.length) return {headers:[],rows:[]};
    var headers=aoa[0].map(function(h,i){ return (h==null||h==="")?("列"+(i+1)):String(h).trim(); });
    var rows=aoa.slice(1).filter(function(r){ return r && r.some(function(c){return c!=null&&String(c).trim()!=="";}); })
      .map(function(r){ var o={}; headers.forEach(function(h,i){ o[h]=(r[i]==null?"":String(r[i])); }); return o; });
    return {headers:headers, rows:rows};
  }
  function parseXLSX(file){
    return loadScript(LIB.xlsx).then(function(){
      return new Promise(function(res,rej){
        var reader=new FileReader();
        reader.onerror=function(){ rej(new Error("文件读取失败")); };
        reader.onload=function(){
          try{
            var wb=XLSX.read(new Uint8Array(reader.result),{type:"array"});
            var name=wb.SheetNames[0];
            var aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:""});
            var out=aoa2hr(aoa);
            out.sheetNote=wb.SheetNames.length>1?("（已读取第1个工作表「"+name+"」，共 "+wb.SheetNames.length+" 个）"):"";
            res(out);
          }catch(err){ rej(err); }
        };
        reader.readAsArrayBuffer(file);
      });
    });
  }
  function parseDOCX(file){
    return loadScript(LIB.mammoth).then(function(){
      return new Promise(function(res,rej){
        var reader=new FileReader();
        reader.onerror=function(){ rej(new Error("文件读取失败")); };
        reader.onload=function(){
          mammoth.convertToHtml({arrayBuffer:reader.result}).then(function(result){
            var html=result.value||"";
            var doc=new DOMParser().parseFromString("<div>"+html+"</div>","text/html");
            var tables=doc.querySelectorAll("table");
            if(!tables.length){ rej(new Error("Word 文档中未找到表格。请将名单/评语整理成表格（首行是列名）后再导入，或另存为 CSV(UTF-8)。")); return; }
            var trs=tables[0].querySelectorAll("tr");
            if(trs.length<2){ rej(new Error("Word 表格内容为空或只有表头，请填写数据行。")); return; }
            var headCells=trs[0].querySelectorAll("th,td");
            var headers=Array.prototype.map.call(headCells,function(c,i){ return (c.textContent||"").trim()||("列"+(i+1)); });
            var rows=[];
            for(var ri=1;ri<trs.length;ri++){
              var tds=trs[ri].querySelectorAll("th,td");
              var o={}, any=false;
              headers.forEach(function(h,i){ var v=(tds[i]&&tds[i].textContent||"").trim(); if(v)any=true; o[h]=v; });
              if(any) rows.push(o);
            }
            res({headers:headers, rows:rows});
          }).catch(function(err){ rej(err); });
        };
        reader.readAsArrayBuffer(file);
      });
    });
  }
  function lines2hr(lines){
    if(!lines.length) return {headers:[],rows:[]};
    function splitCols(l){ if(l.indexOf("\t")>=0) return l.split("\t"); var m=l.split(/\s{2,}/); return m.length>1?m:[l]; }
    var first=splitCols(lines[0]);
    if(first.length>1){
      var headers=first.map(function(h,i){return h.trim()||("列"+(i+1));});
      var rows=lines.slice(1).map(function(l){ var c=splitCols(l); var o={}; headers.forEach(function(h,i){ o[h]=(c[i]==null?"":c[i].trim()); }); return o; });
      rows=rows.filter(function(o){ return Object.keys(o).some(function(k){return o[k]!=="";}); });
      return {headers:headers, rows:rows};
    }
    return {headers:["内容"], rows:lines.map(function(l){return {"内容":l};})};
  }
  function parsePDF(file){
    return loadScript(LIB.pdf).then(function(){
      try{ if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfWorker; } }catch(e){}
      return new Promise(function(res,rej){
        var reader=new FileReader();
        reader.onerror=function(){ rej(new Error("文件读取失败")); };
        reader.onload=function(){
          var data=new Uint8Array(reader.result);
          pdfjsLib.getDocument({data:data}).promise.then(function(pdf){
            var ps=[];
            for(var p=1;p<=pdf.numPages;p++) ps.push(pdf.getPage(p).then(function(page){ return page.getTextContent().then(function(tc){
              return tc.items.map(function(it){ return it.str!=null?it.str:""; }).join(" ");
            }); }));
            Promise.all(ps).then(function(pages){
              var lines=[].concat.apply([], pages.map(function(t){ return t.split(/\n+/); }))
                .map(function(l){return l.trim();}).filter(function(l){return l!=="";});
              var parsed=lines2hr(lines);
              parsed.pdfNote="（PDF 为近似识别，建议优先用 Excel/Word 导入以保证准确）";
              res(parsed);
            }).catch(function(err){ rej(err); });
          }).catch(function(err){ rej(err); });
        };
        reader.readAsArrayBuffer(file);
      });
    });
  }
  function showImpError(err){
    console.error(err);
    document.getElementById("impPreview").innerHTML='<div class="imp-empty">解析出错：'+esc(err&&err.message?err.message:err)+'<br><br>提示：可先把文件用 Excel/WPS 打开，另存为 <b>CSV(UTF-8)</b> 后再导入。</div>';
    document.getElementById("impDo").disabled=true;
  }
  function showPreview(parsed){
    parsed=parsed||{headers:[],rows:[]};
    if(!parsed.headers.length){ document.getElementById("impPreview").innerHTML='<div class="imp-empty">未能识别到表头，请确认文件第一行是列名（CSV/Excel 首行、Word/PDF 表格首行）。</div>'; document.getElementById("impDo").disabled=true; return; }
    var map=buildMapping(impKey, parsed.headers);
    var fieldNames=Object.keys(map);
    if(!fieldNames.length){
      document.getElementById("impPreview").innerHTML='<div class="imp-empty">未能将任何列匹配到本模块的字段。请检查表头是否包含如「姓名 / 分数 / 事由」等关键字。</div>';
      document.getElementById("impDo").disabled=true;
      return;
    }
    var valid=parsed.rows.filter(function(r){ return fieldNames.some(function(fn){ return (r[map[fn]]||"").trim()!==""; }); });
    impData={headers:parsed.headers, rows:valid, map:map};
    var mapHtml=fieldNames.map(function(fn){ return '<span class="mp"><b>'+esc(fn)+'</b> ← '+esc(map[fn])+'</span>'; }).join("");
    var headHtml=parsed.headers.map(function(h){ var hit=fieldNames.some(function(fn){return map[fn]===h;}); return '<span class="hp'+(hit?" hit":"")+'">'+esc(h)+'</span>'; }).join("");
    var samp=valid.slice(0,3).map(function(r){ return '<div class="srow">'+fieldNames.map(function(fn){return '<span>'+esc(r[map[fn]]||"")+'</span>';}).join("")+'</div>'; }).join("");
    document.getElementById("impPreview").innerHTML=
      '<div class="imp-stats">共识别 <b>'+valid.length+'</b> 行 · 匹配字段 <b>'+fieldNames.length+'/'+parsed.headers.length+'</b>'+(parsed.sheetNote?("<br>"+esc(parsed.sheetNote)):"")+(parsed.pdfNote?("<br>"+esc(parsed.pdfNote)):"")+'</div>'
      +'<div class="imp-map">'+mapHtml+'</div>'
      +'<div class="imp-head">'+headHtml+'</div>'
      +'<div class="imp-samp"><div class="srow head">'+fieldNames.map(function(fn){return '<span>'+esc(fn)+'</span>';}).join("")+'</div>'+samp+'</div>';
    document.getElementById("impDo").disabled=(valid.length===0);
  }
  function handleImpFile(e){
    var file=e.target.files && e.target.files[0];
    if(!file) return;
    var t=detectType(file);
    var prev=document.getElementById("impPreview");
    if(t==="csv"){
      var reader=new FileReader();
      reader.onload=function(){ try{ showPreview(parseCSV(String(reader.result||""))); }catch(err){ showImpError(err); } };
      reader.readAsText(file,"UTF-8");
      return;
    }
    prev.innerHTML='<div class="imp-empty">⏳ 正在解析 '+esc(file.name)+' …（首次需加载解析组件，请稍候）</div>';
    var p = t==="xlsx"?parseXLSX(file) : t==="docx"?parseDOCX(file) : t==="pdf"?parsePDF(file) : Promise.reject(new Error("不支持的文件类型"));
    p.then(function(parsed){ showPreview(parsed); }).catch(function(err){ showImpError(err); });
  }
  function confirmImport(){
    if(!impKey||!impData||!impData.rows.length) return;
    var key=impKey, fields=MODULES[key].fields, map=impData.map;
    setStatus("syncing");
    var chain=Promise.resolve(), n=0;
    impData.rows.forEach(function(r){
      var props={};
      fields.forEach(function(f){
        var h=map[f.name]; if(!h) return;
        var v=wrapVal(f, r[h]); if(v) props[f.name]=v;
      });
      if(Object.keys(props).length===0) return;
      chain=chain.then(function(){ return apiAdd(key, props).then(function(){ n++; }); });
    });
    chain.then(function(){ closeImp(); toast("已导入 "+n+" 条 ✓"); return refreshAll(); })
      .then(function(){ setStatus("ok"); })
      .catch(function(err){ console.error(err); setStatus("offline"); toast("导入失败，请重试"); });
  }
  function csvCell(s){ s=String(s==null?"":s).replace(/"/g,'""'); if(/[",\n\r]/.test(s)) s='"'+s+'"'; return s; }
  function exportModule(key){
    var fields=MODULES[key].fields, rows=DATA[key];
    if(!rows.length){ toast("当前模块没有数据可导出"); return; }
    var head=fields.map(function(f){return csvCell(f.name);}).join(",");
    var body=rows.map(function(r){
      return fields.map(function(f){
        var v=r[f.name];
        if(v && typeof v==="object" && !Array.isArray(v)){ if(v.text!=null)v=v.text; else if(v.select!=null)v=v.select; else if(v.number!=null)v=v.number; else if(v.date!=null)v=v.date; else if(v.multi_select)v=v.multi_select.join("、"); }
        else if(Array.isArray(v)) v=v.join("、");
        return csvCell(v==null?"":v);
      }).join(",");
    }).join("\n");
    var csv="﻿"+head+"\n"+body;
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=stripEmoji(MODULES[key].title).replace(/\s/g,"")+"_"+todayStr()+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    toast("已导出 "+rows.length+" 条 ✓");
  }

  /* ---------- 启动 ---------- */
  loadClass();
  applyClass();

  /* ---------- 账号（Supabase Auth：邮箱 + 密码） ---------- */
  function showAuth(msg){
    document.getElementById("authScreen").classList.add("show");
    document.getElementById("authErr").textContent = msg || "";
    if(!db){ document.getElementById("authSub").textContent="无法加载 Supabase 客户端（可能是网络 / CDN 被拦截，或不是通过部署地址打开）。请刷新重试，或确认用 https://cczy1997.github.io/banzhuren-workbench/ 打开本页。"; }
  }
  function hideAuth(){ document.getElementById("authScreen").classList.remove("show"); }
  document.getElementById("authLogin").onclick=function(){
    if(!db){ document.getElementById("authErr").textContent="Supabase 未连接：请刷新页面，或检查部署配置。"; return; }
    var email=document.getElementById("authEmail").value.trim();
    var pwd=document.getElementById("authPwd").value;
    if(!email||!pwd){ document.getElementById("authErr").textContent="请填写邮箱和密码"; return; }
    setStatus("syncing");
    db.auth.signInWithPassword({email:email,password:pwd}).then(function(res){
      if(res.error){
        var m=res.error.message||"登录失败";
        if(/not confirmed/i.test(m)) m="邮箱尚未验证。请先到收件箱点击验证链接，或到 Supabase 后台关闭「Confirm email」后重试。";
        var e2=Object.create(res.error); e2.message=m; throw e2;
      }
      onSignedIn(res.data.user);
    }).catch(function(e){ setStatus("offline"); document.getElementById("authErr").textContent=(e&&e.message)?e.message:"登录失败"; });
  };
  document.getElementById("authSignup").onclick=function(){
    if(!db){ document.getElementById("authErr").textContent="Supabase 未连接：请刷新页面，或检查部署配置。"; return; }
    var email=document.getElementById("authEmail").value.trim();
    var pwd=document.getElementById("authPwd").value;
    if(!email||!pwd){ document.getElementById("authErr").textContent="请填写邮箱和密码"; return; }
    if(pwd.length<6){ document.getElementById("authErr").textContent="密码至少 6 位"; return; }
    setStatus("syncing");
    db.auth.signUp({email:email,password:pwd}).then(function(res){
      if(res.error){
        var m=res.error.message||"注册失败";
        if(/rate limit/i.test(m)) m="验证邮件发送被限流，注册卡住。请到 Supabase 后台关闭「Confirm email」，关闭后注册即直接登录、不再发邮件。";
        var e2=Object.create(res.error); e2.message=m; throw e2;
      }
      if(res.data.session){ onSignedIn(res.data.user); }
      else { setStatus("offline"); document.getElementById("authErr").textContent="注册成功！请前往邮箱完成验证再回来登录；或在 Supabase 后台关闭「Confirm email」可注册即登录。"; }
    }).catch(function(e){ setStatus("offline"); document.getElementById("authErr").textContent=(e&&e.message)?e.message:"注册失败"; });
  };
  document.getElementById("logoutBtn").onclick=function(){
    db.auth.signOut().then(function(){ location.reload(); });
  };
  function onSignedIn(user){
    try{
      curUid=user.id;
      hideAuth();
      document.getElementById("logoutBtn").style.display="";
      renderSidebar();
      render();            // 立即渲染外壳，避免数据加载失败时整页空白
      bootLoad();
    }catch(e){
      console.error(e);
      if(document.getElementById("authErr")) document.getElementById("authErr").textContent="界面渲染出错："+(e&&e.message||e);
    }
  }
  function bootLoad(){
    setStatus("syncing");
    refreshAll().then(function(failed){
      setStatus((failed && failed.length===ALLKEYS.length) ? "offline" : "ok");
    }).catch(function(e){
      console.error(e); setStatus("offline"); syncBanner("err","加载失败，点此重试");
    });
  }

  if(db){
    db.auth.getSession().then(function(res){
      var sess = res.data && res.data.session;
      if(sess){ onSignedIn(sess.user); } else { showAuth(); }
    }).catch(function(){ showAuth(); });
    db.auth.onAuthStateChange(function(evt, sess){
      if(evt==="SIGNED_IN" && sess) curUid=sess.user.id;
      if(evt==="SIGNED_OUT") curUid=null;
    });
  } else {
    showAuth();
  }
})();
</script>
